[project]
name = "ece-order-automation"
version = "0.1.0"
description = "SharePoint Lists automation for ECE order requisitions"
requires-python = ">=3.10"
dependencies = [
    "msal>=1.28.0",
    "pdfrw>=0.4",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
ece-orders = "ece_orders.cli:main"

[tool.setuptools]
packages = ["ece_orders"]
